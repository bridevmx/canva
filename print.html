<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impresión de Pedido</title>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Amatic+SC:wght@400;700&family=Caveat:wght@400;700&family=Cinzel:wght@400;700&family=Courgette&family=Dancing+Script:wght@400;700&family=Righteous&family=Russo+One&family=Sacramento&family=Satisfy&family=Inter:wght@400;700;900&family=Anton&family=Pacifico&family=Montserrat:wght@400;700;900&family=Oswald:wght@400;700&family=Bebas+Neue&family=Lobster&family=Luckiest+Guy&family=Fredoka:wght@300;400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&family=Chewy&family=Permanent+Marker&family=Nunito:wght@400;700;900&family=Raleway:wght@400;700;900&family=Poppins:wght@400;600;700;800&family=Archivo+Black&family=Passion+One:wght@400;700;900&family=Comfortaa:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: white;
      font-family: Inter, sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .sheet {
      position: relative;
      overflow: hidden;
      background: white;
      page-break-after: always;
      break-after: page;
    }
    .text-box {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.05;
      padding: 6px;
    }
    .no-render { display: none !important; }
    @media screen {
      body { background: #f1f5f9; padding: 2rem; }
      .sheet { margin: 0 auto 2rem auto; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading-screen" class="fixed inset-0 flex items-center justify-center bg-white z-[9999]">
    <div class="text-center">
      <div id="loading-spinner" class="text-4xl mb-4">🌀</div>
      <div id="error-icon" class="hidden text-4xl mb-4">⚠️</div>
      <p id="status-text" class="text-slate-600 font-bold">Cargando datos...</p>
    </div>
  </div>

  <!-- Print container -->
  <div id="print-container" style="display:none"></div>

  <script type="module">
    window.RENDER_READY = false;

    const pb = new PocketBase('https://scraping.pockethost.io');
    const qs = new URLSearchParams(window.location.search);
    const id = qs.get('id');
    let token = qs.get('token');
    let paperSize = 'a4';
    let sheet = { w: 794, h: 1123 };
    let items = [];
    let pageColors = { 1: '#ffffff' };
    let pagesCount = 1;

    const elLoadingScreen = document.getElementById('loading-screen');
    const elPrintContainer = document.getElementById('print-container');
    const elLoadingSpinner = document.getElementById('loading-spinner');
    const elErrorIcon = document.getElementById('error-icon');
    const elStatusText = document.getElementById('status-text');

    function setStatus(type, text) {
      if (type === 'error') {
        elLoadingSpinner.classList.add('hidden');
        elErrorIcon.classList.remove('hidden');
      } else {
        elLoadingSpinner.classList.remove('hidden');
        elErrorIcon.classList.add('hidden');
      }
      elStatusText.textContent = text;
    }

    // Sanitizar token de URL
    if (token) {
      sessionStorage.setItem('print_token', token);
      const clean = new URL(window.location.href);
      clean.searchParams.delete('token');
      window.history.replaceState({}, document.title, clean.pathname + (clean.search ? clean.search : '') + clean.hash);
    } else {
      token = sessionStorage.getItem('print_token');
    }

    if (token) pb.authStore.save(token, null);

    if (!pb.authStore.isValid) {
      window.location.replace('/login?redirectTo=/print?id=' + encodeURIComponent(id || ''));
      throw new Error('Not authenticated');
    }

    if (!id) {
      setStatus('error', 'ID de pedido faltante');
      return;
    }

    try {
      const rec = await pb.collection('sticker_orders').getOne(id);
      paperSize = rec.paper_size || 'a4';

      if (paperSize === 'a4') { sheet = { w: 794, h: 1123 }; }
      else { sheet = { w: 816, h: 1056 }; }

      const style = document.createElement('style');
      style.innerHTML = `@page { size: ${paperSize === 'a4' ? 'A4' : 'letter'}; margin: 0; }`;
      document.head.appendChild(style);

      let rawData = rec.admin_canvas_data;
      if (!rawData || (typeof rawData === 'string' && rawData.length < 5)) {
        rawData = rec.canvas_data;
      }

      const data = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
      items = data.items || [];
      pageColors = data.pageColors || { 1: rec.page_bg || '#ffffff' };

      let maxPage = 1;
      items.forEach(item => {
        if (item.page === undefined) item.page = 1;
        if (item.page > maxPage) maxPage = item.page;

        if (item.type === 'image' && item.src?.startsWith('FILE:')) {
          const prefix = item.src.replace('FILE:', '').split('.')[0].replace(/-/g, '_');
          const assets = Array.isArray(rec.upload_assets) ? rec.upload_assets : [rec.upload_assets];
          const fn = assets.find(f => f.startsWith(prefix) || f.includes(prefix));
          if (fn) item.src = pb.files.getUrl(rec, fn);
        }
      });
      pagesCount = maxPage;

      // Renderizar hojas
      renderSheets();

      // Mostrar contenedor, ocultar loading
      elLoadingScreen.style.display = 'none';
      elPrintContainer.style.display = 'block';

      // Esperar a que las imágenes se carguen
      await new Promise(resolve => requestAnimationFrame(resolve));

      const images = Array.from(document.querySelectorAll('#print-container img'));
      await Promise.all(images.map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));

      setTimeout(() => {
        window.RENDER_READY = true;
        window.print();
        console.log('--- RENDER_READY & PRINTING ---');
      }, 500);

    } catch (e) {
      console.error(e);
      setStatus('error', 'Error al recuperar el pedido');
    }

    function renderSheets() {
      elPrintContainer.innerHTML = '';

      for (let p = 1; p <= pagesCount; p++) {
        const bg = pageColors[p] || '#ffffff';
        const sheetEl = document.createElement('div');
        sheetEl.className = 'sheet';
        sheetEl.style.background = bg;
        sheetEl.style.width = sheet.w + 'px';
        sheetEl.style.height = sheet.h + 'px';

        const pageItems = [...items].sort((a, b) => a.z - b.z).filter(i => (i.page || 1) === p);

        pageItems.forEach(item => {
          const wrapper = document.createElement('div');
          wrapper.style.cssText = itemStyle(item);

          if (item.type === 'image') {
            const img = document.createElement('img');
            img.src = item.src;
            img.style.cssText = `width:100%;height:100%;object-fit:${item.fit || 'contain'}`;
            wrapper.appendChild(img);
          } else if (item.type === 'text') {
            if (item.textCurved) {
              const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
              svg.setAttribute('width', '100%');
              svg.setAttribute('height', '100%');
              svg.style.overflow = 'visible';
              const w = Math.max(item.w || 300, 10);
              const R = Math.max(item.textArcRadius || 200, w / 2 + 1);
              const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
              path.setAttribute('id', 'text-arc-' + item.id);
              path.setAttribute('d', `M 0,0 A ${R},${R} 0 0,0 ${w},0`);
              path.setAttribute('fill', 'none');
              svg.appendChild(path);
              const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
              const tp = document.createElementNS('http://www.w3.org/2000/svg', 'textPath');
              tp.setAttribute('href', '#text-arc-' + item.id);
              tp.textContent = item.text;
              tp.style.fontFamily = item.fontFamily;
              tp.style.fontSize = item.fontSize + 'px';
              tp.style.fontWeight = item.fontWeight;
              tp.style.fill = item.color;
              if (item.textShadow) tp.style.textShadow = `${item.shadowOffsetX}px ${item.shadowOffsetY}px ${item.shadowBlur}px ${item.shadowColor}`;
              if (item.textOutline) tp.style.webkitTextStroke = `${item.outlineWidth}px ${item.outlineColor}`;
              txt.appendChild(tp);
              svg.appendChild(txt);
              wrapper.appendChild(svg);
            } else {
              const div = document.createElement('div');
              div.className = 'text-box';
              div.textContent = item.text;
              div.style.cssText = `font-family:${item.fontFamily};color:${item.color};font-size:${item.fontSize}px;font-weight:${item.fontWeight};` +
                (item.textShadow ? `text-shadow:${item.shadowOffsetX}px ${item.shadowOffsetY}px ${item.shadowBlur}px ${item.shadowColor};` : '') +
                (item.textOutline ? `-webkit-text-stroke:${item.outlineWidth}px ${item.outlineColor};` : '');
              wrapper.appendChild(div);
            }
          } else if (item.type === 'shape') {
            const div = document.createElement('div');
            let css = `width:100%;height:100%;background:${item.fillColor || '#3b82f6'};box-sizing:border-box;`;
            if (item.shapeType === 'circle') css += 'border-radius:50%;';
            else if (item.shapeType === 'bubble') css += 'border-radius:8px;';
            else if (item.shapeType === 'rect') css += 'border-radius:4px;';
            else css += 'border-radius:0;';
            if ((item.strokeWidth ?? 0) > 0) css += `border:${item.strokeWidth}px solid ${item.strokeColor};`;
            const clip = {
              star: 'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)',
              heart: 'polygon(50% 15%,70% 0%,85% 15%,100% 30%,100% 50%,50% 100%,0% 50%,0% 30%,15% 15%,30% 0%)',
              triangle: 'polygon(50% 0%,0% 100%,100% 100%)',
              hexagon: 'polygon(25% 0%,75% 0%,100% 50%,75% 100%,25% 100%,0% 50%)',
            }[item.shapeType];
            if (clip) css += `clip-path:${clip};`;
            div.style.cssText = css;
            wrapper.appendChild(div);
          }

          sheetEl.appendChild(wrapper);
        });

        elPrintContainer.appendChild(sheetEl);
      }
    }

    function itemStyle(item) {
      return `position:absolute;` +
        `left:${item.x}px;top:${item.y}px;` +
        `width:${item.w}px;height:${item.h}px;` +
        `z-index:${item.z};` +
        `opacity:${item.opacity ?? 1};` +
        `transform:${item.rotation ? `rotate(${item.rotation}deg)` : 'none'};` +
        `pointer-events:none`;
    }
  </script>
</body>
</html>

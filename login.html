<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMaker - Iniciar sesión</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <script src="auth.js"></script>
  <script>
    if (isAuthenticated()) {
      const ALLOWED_REDIRECTS = ['/canvas', '/dashboard']
      const qs = new URLSearchParams(window.location.search)
      const redirect = qs.get('redirectTo')
      window.location.replace(ALLOWED_REDIRECTS.includes(redirect) ? redirect : '/dashboard')
    }
  </script>
</head>
<body>
  <div class="min-h-screen bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <span class="text-5xl">🔑</span>
        <h1 class="text-2xl font-black text-white mt-3 tracking-tight">StickerMaker</h1>
        <p class="text-slate-400 text-sm mt-1">Accede a tu cuenta</p>
      </div>
      
      <div class="bg-white/5 border border-white/10 rounded-2xl p-6 sm:p-8 space-y-4 backdrop-blur-sm shadow-xl">
        <div id="error-alert" class="hidden bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl px-4 py-3 text-sm text-center"></div>
        <div id="success-alert" class="hidden bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-xl px-4 py-3 text-sm text-center"></div>

        <div class="space-y-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Email, Usuario o Teléfono</label>
            <input id="input-identity" type="text" placeholder="Correo, usuario o celular" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 transition" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Contraseña</label>
            <input id="input-password" type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 transition" />
          </div>
          <button id="btn-submit" disabled class="w-full bg-violet-600 hover:bg-violet-500 active:bg-violet-700 disabled:opacity-50 rounded-xl py-3 text-sm font-bold text-white transition mt-2 shadow-lg">Ingresar</button>
        </div>

        <p class="text-center text-slate-500 text-xs pt-3 mt-4 border-t border-white/10 leading-relaxed">
          ¿No tienes cuenta? <a href="/register" class="text-violet-400 hover:text-violet-300 font-bold transition">Regístrate gratis</a><br><br>
          <a href="/" class="text-slate-600 hover:text-slate-400 transition">← Volver al inicio</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.11.3/+esm';
    import { initAuth, loginWithPassword, getAuthPb } from './src/auth/authStore.js';
    import { bindInput, bindText, bindShow, bindAttr } from './src/ui/render.js';

    // Inicializar Auth de Nanostores
    await initAuth();

    // Atoms locales
    const $identity = atom('');
    const $password = atom('');
    const $loading = atom(false);
    const $error = atom('');
    const $successMsg = atom('');

    // Bindings de UI
    const elIdentity = document.getElementById('input-identity');
    const elPassword = document.getElementById('input-password');
    const elBtnSubmit = document.getElementById('btn-submit');
    const elErrorAlert = document.getElementById('error-alert');
    const elSuccessAlert = document.getElementById('success-alert');

    bindInput(elIdentity, $identity);
    bindInput(elPassword, $password);
    bindText(elErrorAlert, $error);
    bindShow(elErrorAlert, $error);
    bindText(elSuccessAlert, $successMsg);
    bindShow(elSuccessAlert, $successMsg);

    // Estado del botón Submit
    $loading.subscribe(loading => {
      elBtnSubmit.textContent = loading ? 'Iniciando sesión…' : 'Ingresar';
      updateButtonState();
    });

    $identity.subscribe(() => updateButtonState());
    $password.subscribe(() => updateButtonState());

    function updateButtonState() {
      const isDisabled = $loading.get() || !$identity.get() || !$password.get();
      if (isDisabled) elBtnSubmit.setAttribute('disabled', 'true');
      else elBtnSubmit.removeAttribute('disabled');
    }

    // Manejador de Login
    async function handleLogin() {
      if ($loading.get() || !$identity.get() || !$password.get()) return;
      $error.set('');
      $loading.set(true);

      try {
        await loginWithPassword($identity.get(), $password.get());
        
        // Redirigir según el tipo de usuario o parámetro
        const ALLOWED_REDIRECTS = ['/canvas', '/dashboard'];
        const qs = new URLSearchParams(window.location.search);
        const redirect = qs.get('redirectTo');
        window.location.replace(ALLOWED_REDIRECTS.includes(redirect) ? redirect : '/dashboard');
      } catch (e) {
        $error.set(e?.data?.message || 'Credenciales incorrectas o cuenta no verificada');
      } finally {
        $loading.set(false);
      }
    }

    elBtnSubmit.addEventListener('click', handleLogin);
    elPassword.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMaker - Recuperar contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <script>
    if (isAuthenticated()) window.location.replace('/dashboard')
  </script>
  <style>
    body{font-family:Inter,sans-serif}
    .mi{font-family:'Material Icons';font-style:normal;font-weight:400;line-height:1;display:inline-flex;align-items:center;justify-content:center;user-select:none;vertical-align:middle;text-transform:none!important}
    .mi-sm{font-size:16px}.mi-md{font-size:20px}.mi-lg{font-size:24px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .4s ease forwards}
    .fade-up-delay{animation:fadeUp .4s ease .1s forwards;opacity:0}
    @keyframes pulse-ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.3);opacity:0}}
    .pulse-ring{animation:pulse-ring 1.5s ease infinite}
    input:-webkit-autofill{-webkit-box-shadow:0 0 0 30px rgba(15,23,42,.95) inset!important;-webkit-text-fill-color:#fff!important}
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900 overflow-y-auto selection:bg-violet-500/30">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">

      <!-- Icono animado -->
      <div class="text-center mb-8 fade-up">
        <div class="relative inline-flex items-center justify-center w-20 h-20 rounded-full bg-violet-600/15 border border-violet-500/20 mb-5">
          <div class="absolute inset-0 rounded-full bg-violet-500/10 pulse-ring"></div>
          <span class="mi mi-lg text-violet-400 relative z-10" style="font-size:36px">lock_reset</span>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight">¿Olvidaste tu contraseña?</h1>
        <p class="text-slate-400 text-sm mt-2 max-w-xs mx-auto leading-relaxed">Ingresa tu correo y te enviaremos un enlace para restablecerla</p>
      </div>

      <!-- Card -->
      <div class="bg-white/[0.04] border border-white/[0.08] rounded-3xl p-8 backdrop-blur-xl shadow-2xl shadow-black/20 fade-up-delay">
        <div id="error-alert" class="hidden bg-red-500/10 text-red-400 border border-red-500/20 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>
        <div id="success-alert" class="hidden bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>

        <div class="space-y-5">
          <!-- Email Field -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
              <span class="mi mi-sm text-slate-500">email</span>
              Correo Electrónico
            </label>
            <input id="input-email" type="email" placeholder="tu@correo.com" autocomplete="email"
              class="w-full bg-white/[0.04] border border-white/[0.08] rounded-2xl px-4 py-3 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all duration-200" />
          </div>

          <!-- Submit Button -->
          <button id="btn-submit" disabled
            class="w-full flex items-center justify-center gap-2.5 bg-violet-600 hover:bg-violet-500 active:bg-violet-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-2xl py-3.5 text-sm font-bold text-white transition-all duration-200 shadow-lg shadow-violet-900/30 hover:shadow-violet-600/30 hover:-translate-y-0.5 active:translate-y-0">
            <span class="mi mi-sm">send</span>
            <span id="btn-text">Enviar enlace</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-6">
          <div class="flex-1 h-px bg-white/[0.06]"></div>
          <span class="text-[10px] font-bold text-slate-600 uppercase tracking-widest">o</span>
          <div class="flex-1 h-px bg-white/[0.06]"></div>
        </div>

        <!-- Back to login -->
        <a href="/login" class="flex items-center justify-center gap-2 w-full py-3 rounded-2xl border border-white/[0.08] hover:bg-white/[0.04] text-sm font-semibold text-slate-400 hover:text-white transition-all duration-200">
          <span class="mi mi-sm">arrow_back</span>
          Volver al inicio de sesión
        </a>
      </div>

    </div>
  </div>

  <script type="module">
    import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.11.3/+esm';
    import { getAuthPb } from './src/auth/authStore.js';
    import { bindInput, bindText, bindShow } from './src/ui/render.js';

    const $email = atom('');
    const $loading = atom(false);
    const $error = atom('');
    const $successMsg = atom('');

    const elEmail = document.getElementById('input-email');
    const elBtnSubmit = document.getElementById('btn-submit');
    const elBtnText = document.getElementById('btn-text');
    const elErrorAlert = document.getElementById('error-alert');
    const elSuccessAlert = document.getElementById('success-alert');

    bindInput(elEmail, $email);
    bindText(elErrorAlert, $error);
    bindShow(elErrorAlert, $error);
    bindText(elSuccessAlert, $successMsg);
    bindShow(elSuccessAlert, $successMsg);

    $loading.subscribe(loading => {
      elBtnText.textContent = loading ? 'Enviando...' : 'Enviar enlace';
      elBtnSubmit.disabled = loading || !$email.get();
    });

    $email.subscribe(() => {
      if (!$loading.get()) elBtnSubmit.disabled = !$email.get();
    });

    async function handleSubmit() {
      if ($loading.get() || !$email.get()) return;
      $error.set('');
      $successMsg.set('');
      $loading.set(true);

      try {
        const pb = getAuthPb();
        await pb.collection('users_canva').requestPasswordReset($email.get());
        $successMsg.set('Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña en unos minutos.');
        $email.set('');
      } catch (e) {
        $error.set('No se pudo enviar el correo. Intenta de nuevo.');
      } finally {
        $loading.set(false);
      }
    }

    elBtnSubmit.addEventListener('click', handleSubmit);
    elEmail.addEventListener('keydown', ev => { if (ev.key === 'Enter') handleSubmit(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMaker - Recuperar contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <script>if (isAuthenticated()) window.location.replace('/dashboard')</script>
  <style>
    body{font-family:Inter,sans-serif}
    .mi{font-family:'Material Icons';font-style:normal;font-weight:400;line-height:1;display:inline-flex;align-items:center;justify-content:center;user-select:none;vertical-align:middle;text-transform:none!important}
    .mi-sm{font-size:16px}.mi-md{font-size:20px}.mi-lg{font-size:24px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .35s ease forwards}
  </style>
</head>
<body class="bg-slate-50 min-h-screen selection:bg-violet-100">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md fade-up">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-violet-100 border border-violet-200 mb-5">
          <span class="mi mi-lg text-violet-600" style="font-size:32px">lock_reset</span>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">¿Olvidaste tu contraseña?</h1>
        <p class="text-slate-400 text-sm mt-1">Te enviaremos un enlace para restablecerla</p>
      </div>

      <!-- Card -->
      <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
        <div id="error-alert" class="hidden bg-red-50 text-red-600 border border-red-200 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>
        <div id="success-alert" class="hidden bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>

        <form class="space-y-5" onsubmit="return false">
          <!-- Email Field -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
              <span class="mi mi-sm text-slate-400">email</span>
              Correo Electrónico
            </label>
            <input id="input-email" type="email" placeholder="tu@correo.com" autocomplete="email"
              class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-400 transition-all duration-200" />
          </div>

          <!-- Submit Button -->
          <button id="btn-submit" disabled type="submit"
            class="w-full flex items-center justify-center gap-2.5 bg-violet-600 hover:bg-violet-500 active:bg-violet-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-2xl py-3.5 text-sm font-bold text-white transition-all duration-200 shadow-lg shadow-violet-200 hover:shadow-violet-300 hover:-translate-y-0.5 active:translate-y-0">
            <span class="mi mi-sm">send</span>
            <span id="btn-text">Enviar enlace</span>
          </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-6">
          <div class="flex-1 h-px bg-slate-100"></div>
          <span class="text-[10px] font-bold text-slate-300 uppercase tracking-widest">o</span>
          <div class="flex-1 h-px bg-slate-100"></div>
        </div>

        <!-- Back to login -->
        <a href="/login" class="flex items-center justify-center gap-2 w-full py-3 rounded-2xl border border-slate-200 hover:bg-slate-50 text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all duration-200">
          <span class="mi mi-sm">arrow_back</span>
          Volver al inicio de sesión
        </a>
      </div>

    </div>
  </div>

  <script type="module">
    import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.11.3/+esm';
    import { getAuthPb } from './src/auth/authStore.js';
    import { bindInput, bindText, bindShow } from './src/ui/render.js';

    const $email = atom('');
    const $loading = atom(false);
    const $error = atom('');
    const $successMsg = atom('');

    const elEmail = document.getElementById('input-email');
    const elBtnSubmit = document.getElementById('btn-submit');
    const elBtnText = document.getElementById('btn-text');
    const elErrorAlert = document.getElementById('error-alert');
    const elSuccessAlert = document.getElementById('success-alert');

    bindInput(elEmail, $email);
    bindText(elErrorAlert, $error);
    bindShow(elErrorAlert, $error);
    bindText(elSuccessAlert, $successMsg);
    bindShow(elSuccessAlert, $successMsg);

    $loading.subscribe(loading => {
      elBtnText.textContent = loading ? 'Enviando...' : 'Enviar enlace';
      elBtnSubmit.disabled = loading || !$email.get();
    });

    $email.subscribe(() => {
      if (!$loading.get()) elBtnSubmit.disabled = !$email.get();
    });

    async function handleSubmit(e) {
      e.preventDefault();
      if ($loading.get() || !$email.get()) return;
      $error.set('');
      $successMsg.set('');
      $loading.set(true);

      try {
        const pb = getAuthPb();
        await pb.collection('users_canva').requestPasswordReset($email.get());
        $successMsg.set('Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña en unos minutos.');
        $email.set('');
      } catch (e) {
        $error.set('No se pudo enviar el correo. Intenta de nuevo.');
      } finally {
        $loading.set(false);
      }
    }

    elBtnSubmit.addEventListener('click', handleSubmit);
    elEmail.addEventListener('keydown', ev => { if (ev.key === 'Enter') handleSubmit(ev); });
  </script>
</body>
</html>

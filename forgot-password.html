<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMaker - Recuperar contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <script src="auth.js"></script>
  <script>
    if (isAuthenticated()) window.location.replace('/dashboard')
  </script>
</head>
<body>
  <div class="min-h-screen bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <span class="text-5xl">📧</span>
        <h1 class="text-2xl font-black text-white mt-3 tracking-tight">Recuperar contraseña</h1>
        <p class="text-slate-400 text-sm mt-1">Te enviaremos un enlace para restablecerla</p>
      </div>

      <div class="bg-white/5 border border-white/10 rounded-2xl p-6 sm:p-8 space-y-4 backdrop-blur-sm shadow-xl">
        <div id="error-alert" class="hidden bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl px-4 py-3 text-sm text-center"></div>
        <div id="success-alert" class="hidden bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-xl px-4 py-3 text-sm text-center"></div>

        <div class="space-y-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Correo Electrónico</label>
            <input id="input-email" type="email" placeholder="tu@correo.com" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 transition" />
          </div>
          <button id="btn-submit" disabled class="w-full bg-violet-600 hover:bg-violet-500 active:bg-violet-700 disabled:opacity-50 rounded-xl py-3 text-sm font-bold text-white transition mt-2 shadow-lg">Enviar enlace de recuperación</button>
        </div>

        <p class="text-center text-slate-500 text-xs pt-3 mt-4 border-t border-white/10 leading-relaxed">
          <a href="/login" class="text-violet-400 hover:text-violet-300 font-bold transition">← Volver al inicio de sesión</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.11.3/+esm';
    import { getAuthPb } from './src/auth/authStore.js';
    import { bindInput, bindText, bindShow } from './src/ui/render.js';

    const $email = atom('');
    const $loading = atom(false);
    const $error = atom('');
    const $successMsg = atom('');

    const elEmail = document.getElementById('input-email');
    const elBtnSubmit = document.getElementById('btn-submit');
    const elErrorAlert = document.getElementById('error-alert');
    const elSuccessAlert = document.getElementById('success-alert');

    bindInput(elEmail, $email);
    bindText(elErrorAlert, $error);
    bindShow(elErrorAlert, $error);
    bindText(elSuccessAlert, $successMsg);
    bindShow(elSuccessAlert, $successMsg);

    $loading.subscribe(loading => {
      elBtnSubmit.textContent = loading ? 'Enviando…' : 'Enviar enlace de recuperación';
    });

    $email.subscribe(() => {
      const isDisabled = $loading.get() || !$email.get();
      if (isDisabled) elBtnSubmit.setAttribute('disabled', 'true');
      else elBtnSubmit.removeAttribute('disabled');
    });

    async function handleSubmit() {
      if ($loading.get() || !$email.get()) return;
      $error.set('');
      $successMsg.set('');
      $loading.set(true);

      try {
        const pb = getAuthPb();
        await pb.collection('users_canva').requestPasswordReset($email.get());
        $successMsg.set('Si existe una cuenta con ese correo, recibirás un enlace para restablecer tu contraseña.');
        $email.set('');
      } catch (e) {
        $error.set('No se pudo enviar el correo. Intenta de nuevo.');
      } finally {
        $loading.set(false);
      }
    }

    elBtnSubmit.addEventListener('click', handleSubmit);
    elEmail.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMaker - Restablecer contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <script>
    if (isAuthenticated()) window.location.replace('/dashboard')
  </script>
  <style>
    body{font-family:Inter,sans-serif}
    .mi{font-family:'Material Icons';font-style:normal;font-weight:400;line-height:1;display:inline-flex;align-items:center;justify-content:center;user-select:none;vertical-align:middle;text-transform:none!important}
    .mi-sm{font-size:16px}.mi-md{font-size:20px}.mi-lg{font-size:24px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .4s ease forwards}
    .fade-up-delay{animation:fadeUp .4s ease .1s forwards;opacity:0}
    @keyframes pulse-ring{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.3);opacity:0}}
    .pulse-ring{animation:pulse-ring 1.5s ease infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spinner{animation:spin .8s linear infinite}
    input:-webkit-autofill{-webkit-box-shadow:0 0 0 30px rgba(15,23,42,.95) inset!important;-webkit-text-fill-color:#fff!important}
    .pw-toggle{transition:all .15s ease}.pw-toggle:hover{background:rgba(255,255,255,.08)}
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900 overflow-y-auto selection:bg-violet-500/30">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">

      <!-- Header -->
      <div class="text-center mb-8 fade-up" id="header-section">
        <div class="relative inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-600/15 border border-emerald-500/20 mb-5">
          <div class="absolute inset-0 rounded-full bg-emerald-500/10 pulse-ring"></div>
          <span class="mi mi-lg text-emerald-400 relative z-10" style="font-size:36px">shield</span>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight">Restablecer contraseña</h1>
        <p class="text-slate-400 text-sm mt-2 max-w-xs mx-auto leading-relaxed" id="subtitle">Ingresa tu nueva contraseña</p>
      </div>

      <!-- Card -->
      <div class="bg-white/[0.04] border border-white/[0.08] rounded-3xl p-8 backdrop-blur-xl shadow-2xl shadow-black/20 fade-up-delay">
        <div id="error-alert" class="hidden bg-red-500/10 text-red-400 border border-red-500/20 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>
        <div id="success-alert" class="hidden bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>
        <div id="no-token-alert" class="hidden bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>

        <form id="form-container" class="space-y-4" onsubmit="return false">
          <!-- Password Field -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
              <span class="mi mi-sm text-slate-500">lock</span>
              Nueva Contraseña
            </label>
            <div class="relative">
              <input id="input-password" type="password" placeholder="Min. 8 caracteres" autocomplete="new-password"
                class="w-full bg-white/[0.04] border border-white/[0.08] rounded-2xl px-4 py-3 pr-12 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all duration-200" />
              <button type="button" onclick="togglePw('input-password', this)" class="pw-toggle absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-xl text-slate-500">
                <span class="mi mi-sm">visibility_off</span>
              </button>
            </div>
            <!-- Strength indicator -->
            <div id="pw-strength" class="flex gap-1 mt-1 hidden">
              <div class="h-1 flex-1 rounded-full bg-white/[0.06] transition-colors" id="str-1"></div>
              <div class="h-1 flex-1 rounded-full bg-white/[0.06] transition-colors" id="str-2"></div>
              <div class="h-1 flex-1 rounded-full bg-white/[0.06] transition-colors" id="str-3"></div>
              <div class="h-1 flex-1 rounded-full bg-white/[0.06] transition-colors" id="str-4"></div>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
              <span class="mi mi-sm text-slate-500">lock_outline</span>
              Confirmar Contraseña
            </label>
            <div class="relative">
              <input id="input-password-confirm" type="password" placeholder="Repite tu contraseña" autocomplete="new-password"
                class="w-full bg-white/[0.04] border border-white/[0.08] rounded-2xl px-4 py-3 pr-12 text-sm text-white placeholder:text-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500/50 focus:border-violet-500/50 transition-all duration-200" />
              <button type="button" onclick="togglePw('input-password-confirm', this)" class="pw-toggle absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-xl text-slate-500">
                <span class="mi mi-sm">visibility_off</span>
              </button>
            </div>
            <!-- Match indicator -->
            <p id="pw-match" class="text-xs font-medium hidden"></p>
          </div>

          <!-- Submit Button -->
          <button id="btn-submit" disabled type="submit"
            class="w-full flex items-center justify-center gap-2.5 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-2xl py-3.5 text-sm font-bold text-white transition-all duration-200 shadow-lg shadow-emerald-900/30 hover:shadow-emerald-600/30 hover:-translate-y-0.5 active:translate-y-0 mt-2">
            <span class="mi mi-sm">check_circle</span>
            <span id="btn-text">Restablecer contraseña</span>
          </button>
        </form>

        <!-- Back link -->
        <a href="/login" class="flex items-center justify-center gap-2 w-full py-3 mt-4 rounded-2xl border border-white/[0.08] hover:bg-white/[0.04] text-sm font-semibold text-slate-400 hover:text-white transition-all duration-200">
          <span class="mi mi-sm">arrow_back</span>
          Volver al inicio de sesión
        </a>
      </div>

    </div>
  </div>

  <script>
    function togglePw(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('.mi');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility_off';
      }
    }
  </script>
  <script type="module">
    import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.11.3/+esm';
    import { getAuthPb } from './src/auth/authStore.js';
    import { bindInput, bindText, bindShow } from './src/ui/render.js';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const $password = atom('');
    const $passwordConfirm = atom('');
    const $loading = atom(false);
    const $error = atom('');
    const $successMsg = atom('');

    const elPassword = document.getElementById('input-password');
    const elPasswordConfirm = document.getElementById('input-password-confirm');
    const elBtnSubmit = document.getElementById('btn-submit');
    const elBtnText = document.getElementById('btn-text');
    const elErrorAlert = document.getElementById('error-alert');
    const elSuccessAlert = document.getElementById('success-alert');
    const elNoTokenAlert = document.getElementById('no-token-alert');
    const elFormContainer = document.getElementById('form-container');
    const elPwStrength = document.getElementById('pw-strength');
    const elPwMatch = document.getElementById('pw-match');

    bindInput(elPassword, $password);
    bindInput(elPasswordConfirm, $passwordConfirm);
    bindText(elErrorAlert, $error);
    bindShow(elErrorAlert, $error);
    bindText(elSuccessAlert, $successMsg);
    bindShow(elSuccessAlert, $successMsg);

    if (!token) {
      elFormContainer.classList.add('hidden');
      elNoTokenAlert.textContent = 'Enlace inválido o expirado. Solicita uno nuevo desde "¿Olvidaste tu contraseña?".';
      elNoTokenAlert.classList.remove('hidden');
    }

    // Password strength
    function checkStrength(pw) {
      let s = 0;
      if (pw.length >= 8) s++;
      if (/[A-Z]/.test(pw)) s++;
      if (/[0-9]/.test(pw)) s++;
      if (/[^A-Za-z0-9]/.test(pw)) s++;
      return s;
    }

    function updateStrength() {
      const pw = $password.get();
      if (!pw) { elPwStrength.classList.add('hidden'); return; }
      elPwStrength.classList.remove('hidden');
      const s = checkStrength(pw);
      const colors = ['bg-red-500', 'bg-amber-500', 'bg-yellow-400', 'bg-emerald-500'];
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById('str-' + i);
        el.className = 'h-1 flex-1 rounded-full transition-colors ' + (i <= s ? colors[s - 1] : 'bg-white/[0.06]');
      }
    }

    function updateMatch() {
      const pw = $password.get();
      const pwc = $passwordConfirm.get();
      if (!pwc) { elPwMatch.classList.add('hidden'); return; }
      elPwMatch.classList.remove('hidden');
      if (pw === pwc) {
        elPwMatch.textContent = 'Las contraseñas coinciden';
        elPwMatch.className = 'text-xs font-medium text-emerald-400 hidden'.replace('hidden', '');
      } else {
        elPwMatch.textContent = 'Las contraseñas no coinciden';
        elPwMatch.className = 'text-xs font-medium text-red-400 hidden'.replace('hidden', '');
      }
    }

    $password.subscribe(() => { updateStrength(); updateMatch(); updateBtn(); });
    $passwordConfirm.subscribe(() => { updateMatch(); updateBtn(); });

    function updateBtn() {
      const disabled = $loading.get() || !$password.get() || !$passwordConfirm.get() || !token;
      elBtnSubmit.disabled = disabled;
    }

    $loading.subscribe(loading => {
      elBtnText.textContent = loading ? 'Restableciendo...' : 'Restablecer contraseña';
      updateBtn();
    });

    async function handleSubmit(e) {
      e.preventDefault();
      if ($loading.get() || !$password.get() || !$passwordConfirm.get() || !token) return;
      $error.set('');
      $successMsg.set('');

      if ($password.get() !== $passwordConfirm.get()) {
        $error.set('Las contraseñas no coinciden');
        return;
      }
      if ($password.get().length < 8) {
        $error.set('La contraseña debe tener al menos 8 caracteres');
        return;
      }

      $loading.set(true);

      try {
        const pb = getAuthPb();
        await pb.collection('users_canva').confirmPasswordReset(token, $password.get(), $passwordConfirm.get());
        elFormContainer.classList.add('hidden');
        document.getElementById('header-section').querySelector('h1').textContent = 'Listo!';
        document.getElementById('subtitle').textContent = '';
        $successMsg.set('Tu contraseña fue restablecida correctamente. Serás redirigido al inicio de sesión...');
        setTimeout(() => { window.location.href = '/login'; }, 3000);
      } catch (e) {
        $error.set(e?.data?.message || 'El enlace es inválido o ha expirado. Solicita uno nuevo.');
      } finally {
        $loading.set(false);
      }
    }

    elBtnSubmit.addEventListener('click', handleSubmit);
    elPasswordConfirm.addEventListener('keydown', ev => { if (ev.key === 'Enter') handleSubmit(ev); });
    elPassword.addEventListener('keydown', ev => { if (ev.key === 'Enter') handleSubmit(ev); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMaker - Restablecer contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <script src="auth.js"></script>
  <script>
    if (isAuthenticated()) window.location.replace('/dashboard')
  </script>
</head>
<body>
  <div class="min-h-screen bg-gradient-to-br from-slate-900 via-violet-950 to-slate-900 flex items-center justify-center p-4">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <span class="text-5xl">🔒</span>
        <h1 class="text-2xl font-black text-white mt-3 tracking-tight">Restablecer contraseña</h1>
        <p id="subtitle" class="text-slate-400 text-sm mt-1">Ingresa tu nueva contraseña</p>
      </div>

      <div class="bg-white/5 border border-white/10 rounded-2xl p-6 sm:p-8 space-y-4 backdrop-blur-sm shadow-xl">
        <div id="error-alert" class="hidden bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl px-4 py-3 text-sm text-center"></div>
        <div id="success-alert" class="hidden bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 rounded-xl px-4 py-3 text-sm text-center"></div>
        <div id="no-token-alert" class="hidden bg-amber-500/10 text-amber-400 border border-amber-500/30 rounded-xl px-4 py-3 text-sm text-center"></div>

        <div id="form-container" class="space-y-4">
          <div>
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Nueva Contraseña</label>
            <input id="input-password" type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 transition" />
          </div>
          <div>
            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-1">Confirmar Contraseña</label>
            <input id="input-password-confirm" type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-sm text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500 transition" />
          </div>
          <button id="btn-submit" disabled class="w-full bg-violet-600 hover:bg-violet-500 active:bg-violet-700 disabled:opacity-50 rounded-xl py-3 text-sm font-bold text-white transition mt-2 shadow-lg">Restablecer contraseña</button>
        </div>

        <p class="text-center text-slate-500 text-xs pt-3 mt-4 border-t border-white/10 leading-relaxed">
          <a href="/login" class="text-violet-400 hover:text-violet-300 font-bold transition">← Volver al inicio de sesión</a>
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.11.3/+esm';
    import { getAuthPb } from './src/auth/authStore.js';
    import { bindInput, bindText, bindShow } from './src/ui/render.js';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const $password = atom('');
    const $passwordConfirm = atom('');
    const $loading = atom(false);
    const $error = atom('');
    const $successMsg = atom('');

    const elPassword = document.getElementById('input-password');
    const elPasswordConfirm = document.getElementById('input-password-confirm');
    const elBtnSubmit = document.getElementById('btn-submit');
    const elErrorAlert = document.getElementById('error-alert');
    const elSuccessAlert = document.getElementById('success-alert');
    const elNoTokenAlert = document.getElementById('no-token-alert');
    const elFormContainer = document.getElementById('form-container');

    bindInput(elPassword, $password);
    bindInput(elPasswordConfirm, $passwordConfirm);
    bindText(elErrorAlert, $error);
    bindShow(elErrorAlert, $error);
    bindText(elSuccessAlert, $successMsg);
    bindShow(elSuccessAlert, $successMsg);

    if (!token) {
      elFormContainer.classList.add('hidden');
      elNoTokenAlert.textContent = 'Enlace inválido o expirado. Solicita uno nuevo.';
      elNoTokenAlert.classList.remove('hidden');
    }

    $loading.subscribe(loading => {
      elBtnSubmit.textContent = loading ? 'Restableciendo…' : 'Restablecer contraseña';
    });

    [$password, $passwordConfirm].forEach(f => f.subscribe(() => {
      const isDisabled = $loading.get() || !$password.get() || !$passwordConfirm.get() || !token;
      if (isDisabled) elBtnSubmit.setAttribute('disabled', 'true');
      else elBtnSubmit.removeAttribute('disabled');
    }));

    async function handleSubmit() {
      if ($loading.get() || !$password.get() || !$passwordConfirm.get() || !token) return;
      $error.set('');
      $successMsg.set('');

      if ($password.get() !== $passwordConfirm.get()) {
        $error.set('Las contraseñas no coinciden');
        return;
      }

      if ($password.get().length < 8) {
        $error.set('La contraseña debe tener al menos 8 caracteres');
        return;
      }

      $loading.set(true);

      try {
        const pb = getAuthPb();
        await pb.collection('users_canva').confirmPasswordReset(
          token,
          $password.get(),
          $passwordConfirm.get()
        );
        elFormContainer.classList.add('hidden');
        $successMsg.set('Contraseña restablecida correctamente. Serás redirigido al inicio de sesión...');
        setTimeout(() => { window.location.href = '/login'; }, 3000);
      } catch (e) {
        $error.set(e?.data?.message || 'El enlace es inválido o ha expirado. Solicita uno nuevo.');
      } finally {
        $loading.set(false);
      }
    }

    elBtnSubmit.addEventListener('click', handleSubmit);
    elPasswordConfirm.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') handleSubmit();
    });
  </script>
</body>
</html>

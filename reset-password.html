<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StickerMaker - Restablecer contraseña</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/pocketbase@0.26.0/dist/pocketbase.umd.js"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <script>if (isAuthenticated()) window.location.replace('/dashboard')</script>
  <style>
    body{font-family:Inter,sans-serif}
    .mi{font-family:'Material Icons';font-style:normal;font-weight:400;line-height:1;display:inline-flex;align-items:center;justify-content:center;user-select:none;vertical-align:middle;text-transform:none!important}
    .mi-sm{font-size:16px}.mi-md{font-size:20px}.mi-lg{font-size:24px}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .fade-up{animation:fadeUp .35s ease forwards}
    @keyframes checkPop{0%{transform:scale(0);opacity:0}50%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
    .check-pop{animation:checkPop .4s ease forwards}
    input:-webkit-autofill{-webkit-box-shadow:0 0 0 30px #f8fafc inset!important;-webkit-text-fill-color:#1e293b!important}
  </style>
</head>
<body class="bg-slate-50 min-h-screen selection:bg-violet-100">
  <div class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md fade-up">

      <!-- Header -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-violet-100 border border-violet-200 mb-5">
          <span class="mi mi-lg text-violet-600" style="font-size:32px">shield</span>
        </div>
        <h1 class="text-2xl font-black text-slate-900 tracking-tight">Restablecer contraseña</h1>
        <p class="text-slate-400 text-sm mt-1">Ingresa tu nueva contraseña</p>
      </div>

      <!-- Card -->
      <div class="bg-white rounded-3xl p-8 border border-slate-200 shadow-sm">
        <div id="error-alert" class="hidden bg-red-50 text-red-600 border border-red-200 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>
        <div id="success-alert" class="hidden bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>
        <div id="no-token-alert" class="hidden bg-amber-50 text-amber-600 border border-amber-200 rounded-2xl px-5 py-3.5 text-sm text-center mb-4"></div>

        <form id="form-container" class="space-y-4" onsubmit="return false">
          <!-- Password Field -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
              <span class="mi mi-sm text-slate-400">lock</span>
              Nueva Contraseña
            </label>
            <input id="input-password" type="password" placeholder="Min. 8 caracteres" autocomplete="new-password"
              class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-400 transition-all duration-200" />
            <!-- Strength indicator -->
            <div id="pw-strength" class="flex gap-1 mt-1 hidden">
              <div class="h-1 flex-1 rounded-full bg-slate-100 transition-colors" id="str-1"></div>
              <div class="h-1 flex-1 rounded-full bg-slate-100 transition-colors" id="str-2"></div>
              <div class="h-1 flex-1 rounded-full bg-slate-100 transition-colors" id="str-3"></div>
              <div class="h-1 flex-1 rounded-full bg-slate-100 transition-colors" id="str-4"></div>
            </div>
          </div>

          <!-- Confirm Password Field -->
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-widest flex items-center gap-1.5">
              <span class="mi mi-sm text-slate-400">lock_outline</span>
              Confirmar Contraseña
            </label>
            <input id="input-password-confirm" type="password" placeholder="Repite tu contraseña" autocomplete="new-password"
              class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-violet-500/30 focus:border-violet-400 transition-all duration-200" />
            <!-- Match indicator -->
            <p id="pw-match" class="text-xs font-medium hidden"></p>
          </div>

          <!-- Submit Button -->
          <button id="btn-submit" disabled type="submit"
            class="w-full flex items-center justify-center gap-2.5 bg-violet-600 hover:bg-violet-500 active:bg-violet-700 disabled:opacity-40 disabled:cursor-not-allowed rounded-2xl py-3.5 text-sm font-bold text-white transition-all duration-200 shadow-lg shadow-violet-200 hover:shadow-violet-300 hover:-translate-y-0.5 active:translate-y-0 mt-2">
            <span class="mi mi-sm">check_circle</span>
            <span id="btn-text">Restablecer contraseña</span>
          </button>
        </form>

        <!-- Back link -->
        <a href="/login" class="flex items-center justify-center gap-2 w-full py-3 mt-4 rounded-2xl border border-slate-200 hover:bg-slate-50 text-sm font-semibold text-slate-500 hover:text-slate-700 transition-all duration-200">
          <span class="mi mi-sm">arrow_back</span>
          Volver al inicio de sesión
        </a>
      </div>

    </div>
  </div>

  <script type="module">
    import { atom } from 'https://cdn.jsdelivr.net/npm/nanostores@0.11.3/+esm';
    import { getAuthPb } from './src/auth/authStore.js?v=3.0.0';
    import { bindInput, bindText, bindShow } from './src/ui/render.js?v=3.0.0';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    const $password = atom('');
    const $passwordConfirm = atom('');
    const $loading = atom(false);
    const $error = atom('');
    const $successMsg = atom('');

    const elPassword = document.getElementById('input-password');
    const elPasswordConfirm = document.getElementById('input-password-confirm');
    const elBtnSubmit = document.getElementById('btn-submit');
    const elBtnText = document.getElementById('btn-text');
    const elErrorAlert = document.getElementById('error-alert');
    const elSuccessAlert = document.getElementById('success-alert');
    const elNoTokenAlert = document.getElementById('no-token-alert');
    const elFormContainer = document.getElementById('form-container');
    const elPwStrength = document.getElementById('pw-strength');
    const elPwMatch = document.getElementById('pw-match');

    bindInput(elPassword, $password);
    bindInput(elPasswordConfirm, $passwordConfirm);
    bindText(elErrorAlert, $error);
    bindShow(elErrorAlert, $error);
    bindText(elSuccessAlert, $successMsg);
    bindShow(elSuccessAlert, $successMsg);

    if (!token) {
      elFormContainer.classList.add('hidden');
      elNoTokenAlert.textContent = 'Enlace invalido o expirado. Solicita uno nuevo desde "¿Olvidaste tu contraseña?".';
      elNoTokenAlert.classList.remove('hidden');
    }

    function checkStrength(pw) {
      let s = 0;
      if (pw.length >= 8) s++;
      if (/[A-Z]/.test(pw)) s++;
      if (/[0-9]/.test(pw)) s++;
      if (/[^A-Za-z0-9]/.test(pw)) s++;
      return s;
    }

    function updateStrength() {
      const pw = $password.get();
      if (!pw) { elPwStrength.classList.add('hidden'); return; }
      elPwStrength.classList.remove('hidden');
      const s = checkStrength(pw);
      const colors = ['bg-red-400', 'bg-amber-400', 'bg-yellow-400', 'bg-emerald-400'];
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById('str-' + i);
        el.className = 'h-1 flex-1 rounded-full transition-colors ' + (i <= s ? colors[s - 1] : 'bg-slate-100');
      }
    }

    function updateMatch() {
      const pw = $password.get();
      const pwc = $passwordConfirm.get();
      if (!pwc) { elPwMatch.classList.add('hidden'); return; }
      elPwMatch.classList.remove('hidden');
      if (pw === pwc) {
        elPwMatch.textContent = 'Las contraseñas coinciden';
        elPwMatch.className = 'text-xs font-medium text-emerald-600';
      } else {
        elPwMatch.textContent = 'Las contraseñas no coinciden';
        elPwMatch.className = 'text-xs font-medium text-red-500';
      }
    }

    function updateBtn() {
      elBtnSubmit.disabled = $loading.get() || !$password.get() || !$passwordConfirm.get() || !token;
    }

    $password.subscribe(() => { updateStrength(); updateMatch(); updateBtn(); });
    $passwordConfirm.subscribe(() => { updateMatch(); updateBtn(); });
    $loading.subscribe(loading => { elBtnText.textContent = loading ? 'Restableciendo...' : 'Restablecer contraseña'; updateBtn(); });

    async function handleSubmit(e) {
      e.preventDefault();
      if ($loading.get() || !$password.get() || !$passwordConfirm.get() || !token) return;
      $error.set('');
      $successMsg.set('');

      if ($password.get() !== $passwordConfirm.get()) {
        $error.set('Las contraseñas no coinciden');
        return;
      }
      if ($password.get().length < 8) {
        $error.set('La contraseña debe tener al menos 8 caracteres');
        return;
      }

      $loading.set(true);

      try {
        const pb = getAuthPb();
        await pb.collection('users_canva').confirmPasswordReset(token, $password.get(), $passwordConfirm.get());
        elFormContainer.classList.add('hidden');
        document.querySelector('h1').textContent = 'Listo!';
        $successMsg.set('Tu contraseña fue restablecida correctamente. Serás redirigido al inicio de sesión...');
        setTimeout(() => { window.location.href = '/login'; }, 3000);
      } catch (e) {
        $error.set(e?.data?.message || 'El enlace es inválido o ha expirado. Solicita uno nuevo.');
      } finally {
        $loading.set(false);
      }
    }

    elBtnSubmit.addEventListener('click', handleSubmit);
    elPasswordConfirm.addEventListener('keydown', ev => { if (ev.key === 'Enter') handleSubmit(ev); });
    elPassword.addEventListener('keydown', ev => { if (ev.key === 'Enter') handleSubmit(ev); });
  </script>
</body>
</html>
